<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
<title>GitHub profile banner for David García Jorge</title>
<desc>A banner combining chef knife and code symbols representing David's transition from chef to developer</desc>
<rect x="0" y="0" width="680" height="200" fill="#0d1117"/>
<line x1="0" y1="4" x2="680" y2="4" stroke="#e85d4a" stroke-width="4"/>
<g transform="translate(52, 60)">
  <rect x="0" y="0" width="3" height="70" fill="#e85d4a" rx="1"/>
  <line x1="14" y1="8" x2="14" y2="55" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <ellipse cx="14" cy="60" rx="5" ry="5" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
  <path d="M20 35 L28 35" stroke="#4a9eff" stroke-width="1.5" fill="none"/>
  <path d="M24 31 L24 39" stroke="#4a9eff" stroke-width="1.5" fill="none"/>
  <path d="M34 28 L46 28 L46 42 L34 42 Z" fill="none" stroke="#888" stroke-width="1"/>
  <line x1="40" y1="42" x2="40" y2="55" stroke="#888" stroke-width="1"/>
  <rect x="36" y="55" width="8" height="3" fill="#888" rx="1"/>
</g>
<path d="M88 100 Q110 80 132 100" fill="none" stroke="#e85d4a" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="110" y="95" fill="#e85d4a" font-family="monospace" font-size="9" text-anchor="middle">→</text>
<g transform="translate(140, 58)">
  <rect x="0" y="0" width="120" height="14" rx="3" fill="#1e2d3d"/>
  <text x="6" y="10" fill="#4a9eff" font-family="monospace" font-size="9">const</text>
  <text x="38" y="10" fill="#e8c97a" font-family="monospace" font-size="9">david</text>
  <text x="72" y="10" fill="#aaa" font-family="monospace" font-size="9">=</text>
  <text x="80" y="10" fill="#4ec9b0" font-family="monospace" font-size="9">{}</text>
  <rect x="0" y="18" width="120" height="14" rx="3" fill="#1e2d3d"/>
  <text x="6" y="28" fill="#9cdcfe" font-family="monospace" font-size="9">stack</text>
  <text x="34" y="28" fill="#aaa" font-family="monospace" font-size="9">:</text>
  <text x="42" y="28" fill="#ce9178" font-family="monospace" font-size="9">"Vue·ROS2·AI"</text>
  <rect x="0" y="36" width="120" height="14" rx="3" fill="#1e2d3d"/>
  <text x="6" y="46" fill="#9cdcfe" font-family="monospace" font-size="9">passion</text>
  <text x="46" y="46" fill="#aaa" font-family="monospace" font-size="9">:</text>
  <text x="54" y="46" fill="#ce9178" font-family="monospace" font-size="9">"∞"</text>
  <rect x="0" y="54" width="120" height="14" rx="3" fill="#1e2d3d"/>
  <text x="6" y="64" fill="#4ec9b0" font-family="monospace" font-size="9">// ex-Michelin chef</text>
</g>
<text x="340" y="75" fill="#ffffff" font-family="Georgia, serif" font-size="26" font-weight="400">David García Jorge</text>
<text x="340" y="100" fill="#e85d4a" font-family="monospace" font-size="11" letter-spacing="2">FULL STACK DEVELOPER</text>
<line x1="340" y1="110" x2="620" y2="110" stroke="#333" stroke-width="0.5"/>
<text x="340" y="128" fill="#888" font-family="Georgia, serif" font-size="12" font-style="italic">"From Michelin stars to production code.</text>
<text x="340" y="144" fill="#888" font-family="Georgia, serif" font-size="12" font-style="italic">Same obsession. Different tools."</text>
<text x="340" y="172" fill="#4a9eff" font-family="monospace" font-size="10">Vue.js</text>
<text x="390" y="172" fill="#555" font-family="monospace" font-size="10">·</text>
<text x="400" y="172" fill="#4a9eff" font-family="monospace" font-size="10">Python</text>
<text x="448" y="172" fill="#555" font-family="monospace" font-size="10">·</text>
<text x="458" y="172" fill="#4a9eff" font-family="monospace" font-size="10">TypeScript</text>
<text x="524" y="172" fill="#555" font-family="monospace" font-size="10">·</text>
<text x="534" y="172" fill="#e85d4a" font-family="monospace" font-size="10">ROS2</text>
<text x="572" y="172" fill="#555" font-family="monospace" font-size="10">·</text>
<text x="582" y="172" fill="#4a9eff" font-family="monospace" font-size="10">3D</text>
<line x1="0" y1="196" x2="680" y2="196" stroke="#e85d4a" stroke-width="4"/>
